services:
  backend:
    build:
      context: ./backend
    container_name: clepfinder-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: clepfinder-frontend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - PORT=3000
      # Optionally set an API base for your frontend code if used
      # - REACT_APP_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build:
      context: ./admin
    container_name: clepfinder-admin
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
      - PORT=3001
      # Optionally set an API base for your admin app if used
      # - REACT_APP_API_URL=http://localhost:8000/api
    ports:
      - "3001:3001"
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  studentview:
    build:
      context: ./studentview
    container_name: clepfinder-studentview
    environment:
      # Vite needs explicit host binding when running in Docker
      - VITE_PORT=5173
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
    volumes:
      - ./studentview:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: clepfinder-net
